version: '3.9'

services:
  # ─── Database ──────────────────────────────────────────
  mongo:
    image: mongo:latest
    container_name: notes-sphere-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - notes-network

  # ─── Backend API ──────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notes-sphere-server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/notes-sphere
      - JWT_SECRET=supersecretjwtkey
      - GUEST_EMAIL=guest@notessphere.demo
      - GUEST_PASSWORD=GuestDemo@123
    restart: unless-stopped
    depends_on:
      - mongo
    networks:
      - notes-network

  # ─── Frontend (Dev only) ──────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: notes-sphere-client
    ports:
      - "3000:3000"
    volumes:
      - ./client/src:/app/src
    environment:
      - REACT_APP_API_BASE=http://localhost:5000
    networks:
      - notes-network
    profiles:
      - dev

networks:
  notes-network:
    driver: bridge

volumes:
  mongo-data:
